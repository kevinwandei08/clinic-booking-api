
name: Clinic Booking API CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clinic_booking"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/clinic_booking

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare isolated test database
        env:
          PGPASSWORD: postgres
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/clinic_booking' \
            > .env

          psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE clinic_booking_test;"

      - name: Compile application and tests
        run: python -m compileall -q app tests

      - name: Run regression tests
        run: python -m pytest -v

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured in GitHub Actions secrets."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL"
